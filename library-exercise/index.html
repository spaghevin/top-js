<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8">
        <link href="https://fonts.googleapis.com/css?family=Quintessential" rel="stylesheet">
        <title>
            My Library
        </title>

        <link rel="stylesheet" type="text/css" href="books.css">
        <script src="books.js" defer></script>


    </head>

    <body>
        <header id="header">
            <h1 id="title">
                My Library
            </h1>
        </header>
        <div id = "wrapper">
            <div id="bookshelf">
                <!-- <div class = "book">
                    <p id="book-title">s</p>
                    <p id="book-author">s</p>
                    <p id="book-read">s</p>
                </div> -->
            </div>
            <form id="entry_form" action="" method="">
                <label for="book_title_input">Book Title:</label>
                <br>
                <input type="text" id="book_title_input" name="input_book_title">
                <br>
                <label for="book_author_input">Book Author:</label>
                <br>
                <input type="text" id="book_author_input" name="input_book_author">
                <br>
                <label for="book_read_input">Book Read? </label>
                <input type="checkbox" id="book_read_input" name="input_book_read" checked>
                <hr id="line_across">
                <input id = "submit_button" type="submit" value="Add To Library">
            </form>
        </div>

        
        
        
    </body>
</html>
